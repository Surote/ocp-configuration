apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: db-secret-sync
subjects:
  - kind: ServiceAccount
    name: db-secret-sync
    namespace: redhat-ods-applications
