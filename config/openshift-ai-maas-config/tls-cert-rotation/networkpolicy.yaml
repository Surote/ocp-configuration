apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tls-cert-rotator-allow-apiserver
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: tls-cert-rotator
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
