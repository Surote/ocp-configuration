apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-maastenantconfig-manager
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - maas.opendatahub.io
    resources:
      - maastenantconfigs
    verbs:
      - get
      - list
      - watch
      - update
      - patch
