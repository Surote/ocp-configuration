apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: infra-worker
  labels:
    # the label is used to identify the machine config pool for the infra-logmon role for kubeletconfig
    pools.operator.machineconfiguration.openshift.io/infra-worker: ""
spec:
  machineConfigSelector:
    matchExpressions:
      - {key: machineconfiguration.openshift.io/role, operator: In, values: [worker,infra-worker]}
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/infra-worker: ""
