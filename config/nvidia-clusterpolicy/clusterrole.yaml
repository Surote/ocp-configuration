apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-nvidia-clusterpolicy-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - nvidia.com
    resources:
      - clusterpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
