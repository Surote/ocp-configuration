apiVersion: v1
kind: Namespace
metadata:
  name: all-sa
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-admin
  namespace: all-sa
---
apiVersion: v1
kind: Secret
metadata:
  name: sa-admin-secret
  namespace: all-sa
  annotations:
    kubernetes.io/service-account.name: sa-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sa-admin-cluster-admin
subjects:
  - kind: ServiceAccount
    name: sa-admin
    namespace: all-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin