apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roundtable-ai
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Surote/ocp-configuration.git
    targetRevision: main
    path: argocd/roundtable-ai
  destination:
    server: https://kubernetes.default.svc
  syncPolicy: {}
